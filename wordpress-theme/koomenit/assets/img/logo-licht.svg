<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 360" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800&amp;display=swap');
      .brand-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 96px; font-weight: 800; }
    </style>
  </defs>

  <!-- Constellation background -->
  <g stroke="rgba(100, 116, 139, 0.28)" stroke-width="2.5">
    <line x1="200" y1="40" x2="310" y2="85" />
    <line x1="310" y1="85" x2="290" y2="270" />
    <line x1="290" y1="270" x2="180" y2="340" />
    <line x1="180" y1="340" x2="80" y2="290" />
    <line x1="80" y1="290" x2="135" y2="160" />
    <line x1="135" y1="160" x2="200" y2="40" />
    <line x1="135" y1="160" x2="310" y2="85" />
    <line x1="135" y1="160" x2="290" y2="270" />
  </g>

  <!-- Constellation nodes -->
  <circle cx="200" cy="40" r="8" fill="#94a3b8" opacity="0.6"/>
  <circle cx="310" cy="85" r="9" fill="#94a3b8" opacity="0.6"/>
  <circle cx="290" cy="270" r="9" fill="#94a3b8" opacity="0.6"/>
  <circle cx="180" cy="340" r="7" fill="#94a3b8" opacity="0.6"/>
  <circle cx="80" cy="290" r="7" fill="#94a3b8" opacity="0.6"/>
  <circle cx="200" cy="120" r="23" fill="#cbd5e1" opacity="0.85"/>

  <!-- Logo Mark (K) -->
  <rect x="105" y="80" width="40" height="200" rx="4" fill="#1d63ed" />
  <circle cx="180" cy="180" r="22" fill="#3b82f6" />
  <polygon points="198,215 238,215 305,280 260,280" fill="#1d63ed" />

  <!-- Typography -->
  <text x="360" y="215" class="brand-title">
    <tspan fill="#0f172a">koomen</tspan><tspan fill="#64748b">.it</tspan>
  </text>
</svg>